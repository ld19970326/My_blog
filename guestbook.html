<style>
    /* 星星闪烁动画 */
    .star-twinkle {
        position: fixed;
        pointer-events: none; /* 确保不影响鼠标点击 */
        z-index: 9999;
        animation: fadeOut 2s forwards;
    }
    @keyframes fadeOut {
        0% { opacity: 0; transform: scale(0.5); }
        50% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 0; transform: scale(0.8); }
    }
</style>

<script>
    function createStar() {
        const star = document.createElement('img');
        star.src = 'images/star.png'; // 请确保你的 images 文件夹里有这张图
        star.className = 'star-twinkle';
        
        // 随机位置和大小
        const size = Math.random() * 20 + 10 + 'px';
        star.style.width = size;
        star.style.left = Math.random() * window.innerWidth + 'px';
        star.style.top = Math.random() * window.innerHeight + 'px';
        
        document.body.appendChild(star);
        
        // 动画结束后移除元素，防止页面卡顿
        setTimeout(() => {
            star.remove();
        }, 2000);
    }
    // 每 500 毫秒生成一颗新星星
    setInterval(createStar, 500);
</script>

        const now = new Date();

        const timeString = now.getHours().toString().padStart(2, '0') + ":" + 
                           now.getMinutes().toString().padStart(2, '0') + ":" + 
                           now.getSeconds().toString().padStart(2, '0');
        
        document.getElementById('current-date').innerText = dateString;
        document.getElementById('current-time').innerText = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock();

<script>
// 新增：点击表情图标时，把代号加到输入框里
function addEmoji(num) {
    const textarea = document.getElementById('userText');
    textarea.value += `$emo${num}$`; // 在末尾追加表情代号
    textarea.focus(); // 让光标回到输入框
}

// 表情功能：将代号解析为图片标签
    function parseEmoji(text) {
    for(let i=1; i<=12; i++) {
        const reg = new RegExp('\\$emo' + i + '\\$', 'g');
        text = text.replace(reg, '<img src="images/emo' + i + '.png" class="msg-emoji">');
    }
    return text;
}

        "好感动，谢谢你的支持！", "要天天开心哦！约定好了！"
    ];

    // 初始化 IndexedDB 数据库
    let db;
    const request = indexedDB.open("SweetPeaBlogDB", 1);

    request.onerror = function(event) {
        console.error("数据库打开报错，可能是因为浏览器的隐私设置阻止了本地文件缓存。");
    };

    request.onupgradeneeded = function(event) {
        db = event.target.result;
        // 创建一个表，用自增的数字作为主键
        const objectStore = db.createObjectStore("messages", { keyPath: "id", autoIncrement: true });
    };

    request.onsuccess = function(event) {
        db = event.target.result;
        loadMessages(); // 网页一打开就加载之前的留言
    };

    // 获取当前时间的函数
    function getCurrentTime() {
        const now = new Date();
        return `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;
    }

    // 把留言画在页面上的函数
    function renderMessage(name, text, time, isAdmin) {
        const board = document.getElementById('messageBoard');
        const newMessage = document.createElement('div');
        newMessage.className = 'message';
        // --- 核心修改：在显示之前，把文字里的代号转成图片 ---
        var processedText = parseEmoji(text); 
        // 站长的名字是粉色，访客的名字是薄荷绿
        const nameColor = isAdmin ? '#eec4d0' : '#aebcaa'; 
        
        newMessage.innerHTML = `
            <div class="msg-date">${time}</div>
            <div class="msg-name" style="color: ${nameColor}">▶ ${name} 说：</div>
            <div class="msg-content">${processedText}</div>
        `;
        // 把新留言永远插在最上面
        board.insertBefore(newMessage, board.firstChild);
    }

    // 从数据库加载历史留言
    function loadMessages() {
        const transaction = db.transaction(["messages"], "readonly");
        const objectStore = transaction.objectStore("messages");
        const getRequest = objectStore.getAll();

        getRequest.onsuccess = function(event) {
            const messages = event.target.result;
            // 清空当前的显示
            document.getElementById('messageBoard').innerHTML = '';
            // 逐个画出来（因为是依次往上插，所以最新的会在最上面）
            messages.forEach(msg => {
                renderMessage(msg.name, msg.text, msg.time, msg.isAdmin);
            });
        };
    }

    // 存入数据库的函数
    function saveToDB(msg, callback) {
        const transaction = db.transaction(["messages"], "readwrite");
        const objectStore = transaction.objectStore("messages");
        const addRequest = objectStore.add(msg);
        addRequest.onsuccess = function() {
            if(callback) callback();
        };
    }

          // 点击发送留言时触发的函数
    function postMessage() {
        var nameInput = document.getElementById('userName');
        var textInput = document.getElementById('userText');
        
        var name = nameInput.value.trim() || "神秘访客";
        var rawText = textInput.value.trim(); // 获取原始文字
        
        if (rawText === "") {
            alert("总得写点什么吧~");
            return;
        }

        var timeNow = getCurrentTime(); 

        // 2. 创建要保存的对象 (直接存原始文字 rawText)
        var userMsg = {
            name: name,
            text: rawText, 
            time: timeNow,         
            isAdmin: false
        };

        // 3. 存入数据库并显示
        saveToDB(userMsg, function() {
            // 注意：renderMessage 内部现在会自动处理表情了
            renderMessage(userMsg.name, userMsg.text, userMsg.time, false);
            
            // 清空输入框
            textInput.value = "";

            // 4. 魔法：1.5秒后，站长自动回复
            setTimeout(function() {
                const randomReply = autoReplies[Math.floor(Math.random() * autoReplies.length)];
                const adminMsg = { 
                    name: "☆ 站长自动回复机", 
                    text: randomReply, 
                    time: getCurrentTime(), 
                    isAdmin: true 
                };
                
                saveToDB(adminMsg, function() {
                    renderMessage(adminMsg.name, adminMsg.text, adminMsg.time, true);
                });
            }, 1500);
        });
    }

</script>
